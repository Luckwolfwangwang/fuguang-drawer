name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package portable app
        run: npm run package

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: fuguang-drawer-win32-x64
          path: release/浮光抽屉-win32-x64/**
          if-no-files-found: error
          retention-days: 14
